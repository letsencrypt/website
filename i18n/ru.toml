other = "Квалифицированное благотворительное распределение"

[donate_2026_qualified_charitable_distribution_text]
other = "Если вам 70½ лет или больше, вы можете сделать пожертвование в пользу ISRG напрямую со своего индивидуального пенсионного счета (IRA), открытого в США, не уплачивая подоходный налог с этой суммы. Такой вариант часто называют «благотворительным переводом из IRA» или «квалифицированным благотворительным распределением» (QCD) Вы можете пожертвовать сумму, не превышающую установленный IRS ежегодный лимит, который пересматривается каждый год, поэтому уточните актуальный размер лимита у своего финансового консультанта."

[donate_2026_qualified_charitable_distribution_advisor_text]
other = "Пожалуйста, обратитесь за консультацией к своему финансовому или юридическому консультанту."

[donate_2026_qualified_charitable_distribution_instructions_text]
other = "Чтобы сделать пожертвование, попросите администратора вашего пенсионного счета (IRA) направить средства непосредственно в ISRG. Предоставьте ему наше официальное юридическое имя и федеральный налоговый идентификатор (Federal Tax ID), чтобы нас можно было идентифицировать. Пожалуйста, также сообщите нам о своем пожертвовании. Часто администраторы IRA переводят средства, не указывая имя благотворителя; поэтому, если вы напишете нам короткое сообщение, мы сможем поблагодарить вас и учесть все ваши пожелания относительно этого пожертвования."

